lcohol\u003cbr\u003euse can impact our health. Um, and my role is to be helpful.\u003cbr\u003eI can share some information with you about alcohol use, um,\u003cbr\u003ebut I don&#x27;t tell anyone what to do. It&#x27;s always up\u003cbr\u003eto the patient to decide what they wanna do about their\u003cbr\u003edrinking. Um, so is it okay if we talk a little bit more\u003cbr\u003eabout your alcohol use?\u003cbr\u003e\u003ci\u003earousal: -0.00102 | f0_mean: 23.6 | loudness_mean: 0.405 | words_per_min: 222 | silence_ratio: 0.02 | jitter: 0.0195 | shimmer: 1.04 | hnr: 3.87 | alpha_ratio: -13.5\u003c\u002fi\u003e","\u003cb\u003e#7\u003c\u002fb\u003e [51.5s] therapist\u003cbr\u003eHow would you define drinking too much?\u003cbr\u003e\u003ci\u003earousal: 0.251 | f0_mean: 29.6 | loudness_mean: 0.156 | words_per_min: 140 | silence_ratio: 0.49 | jitter: 0.018 | shimmer: 1.49 | hnr: 2.64 | alpha_ratio: -8.39\u003c\u002fi\u003e","\u003cb\u003e#9\u003c\u002fb\u003e [70.5s] therapist\u003cbr\u003eMm-hmm. Well, in this country, the guidelines are men can\u003cbr\u003edrink up to 14 drinks a week or up to four on one occasion\u003cbr\u003eand still be low risk.\u003cbr\u003e\u003ci\u003earousal: -0.324 | f0_mean: 22.7 | loudness_mean: 0.405 | words_per_min: 158 | silence_ratio: 0.125 | jitter: 0.0166 | shimmer: 1.09 | hnr: 4.25 | alpha_ratio: -16.1\u003c\u002fi\u003e","\u003cb\u003e#11\u003c\u002fb\u003e [84.5s] therapist\u003cbr\u003eSo a limit of four a night doesn&#x27;t feel right to you?\u003cbr\u003e\u003ci\u003earousal: 0.684 | f0_mean: 24.7 | loudness_mean: 0.395 | words_per_min: 240 | silence_ratio: 0.19 | jitter: 0.0409 | shimmer: 1.43 | hnr: 3.32 | alpha_ratio: -15.8\u003c\u002fi\u003e","\u003cb\u003e#13\u003c\u002fb\u003e [94.0s] therapist\u003cbr\u003eYou&#x27;re not alone in feeling that way. Uh, binge\u003cbr\u003edrinking can feel normal to some people.\u003cbr\u003e\u003ci\u003earousal: -0.371 | f0_mean: 22.4 | loudness_mean: 0.37 | words_per_min: 160 | silence_ratio: 0.238 | jitter: 0.0178 | shimmer: 0.988 | hnr: 4.17 | alpha_ratio: -16\u003c\u002fi\u003e","\u003cb\u003e#16\u003c\u002fb\u003e [112.0s] therapist\u003cbr\u003eMm-hmm. Well, technically, we define binge drinking as\u003cbr\u003ehaving more than four drinks on one occasion.\u003cbr\u003e\u003ci\u003earousal: -0.465 | f0_mean: 23 | loudness_mean: 0.248 | words_per_min: 120 | silence_ratio: 0.25 | jitter: 0.0178 | shimmer: 1.16 | hnr: 3.83 | alpha_ratio: -16.4\u003c\u002fi\u003e","\u003cb\u003e#18\u003c\u002fb\u003e [135.0s] therapist\u003cbr\u003eWell, uh, we know if someone binge drinks over time,\u003cbr\u003ethere&#x27;s kind of two categories of risk. There&#x27;s\u003cbr\u003ethe short-term risk where someone who binge drinks is more\u003cbr\u003elikely to fall down, hurt themselves through an accident,\u003cbr\u003euh, they&#x27;re more likely to drive while under the\u003cbr\u003einfluence. Uh, but over the long term, binge drinking can\u003cbr\u003ealso, uh, cause things like heart disease, uh, different\u003cbr\u003ekinds of cancer, liver problems obviously, and then even\u003cbr\u003emental health issues like depression and anxiety are more\u003cbr\u003elikely to happen.\u003cbr\u003e\u003ci\u003earousal: -0.0159 | f0_mean: 23.3 | loudness_mean: 0.441 | words_per_min: 172 | silence_ratio: 0.024 | jitter: 0.0191 | shimmer: 1.05 | hnr: 3.98 | alpha_ratio: -13.8\u003c\u002fi\u003e","\u003cb\u003e#20\u003c\u002fb\u003e [156.0s] therapist\u003cbr\u003eCan I ask you, uh, what do you like about drinking alcohol?\u003cbr\u003e\u003ci\u003earousal: -0.0444 | f0_mean: 25.8 | loudness_mean: 0.439 | words_per_min: 180 | silence_ratio: 0.085 | jitter: 0.0184 | shimmer: 1.09 | hnr: 5.46 | alpha_ratio: -13.3\u003c\u002fi\u003e","\u003cb\u003e#22\u003c\u002fb\u003e [172.5s] therapist\u003cbr\u003eAnd so what about your drinking do you not like or is there\u003cbr\u003eanything that worries you about your drinking?\u003cbr\u003e\u003ci\u003earousal: 0.0128 | f0_mean: 22.1 | loudness_mean: 0.446 | words_per_min: 240 | silence_ratio: 0 | jitter: 0.0163 | shimmer: 0.994 | hnr: 3.82 | alpha_ratio: -17.7\u003c\u002fi\u003e","\u003cb\u003e#24\u003c\u002fb\u003e [189.5s] therapist\u003cbr\u003eSo, on one hand, you like how beer tastes, uh, it&#x27;s\u003cbr\u003epart of your social life to some extent, um, but on the\u003cbr\u003eother hand, you don&#x27;t like the idea of it posing risks\u003cbr\u003eto your health over the long term?\u003cbr\u003e\u003ci\u003earousal: 0.452 | f0_mean: 24 | loudness_mean: 0.601 | words_per_min: 224 | silence_ratio: 0 | jitter: 0.0202 | shimmer: 1.03 | hnr: 3.9 | alpha_ratio: -12.7\u003c\u002fi\u003e","\u003cb\u003e#25\u003c\u002fb\u003e [201.0s] therapist\u003cbr\u003eSo weighing those things, you know, what you like about your\u003cbr\u003edrinking, what you don&#x27;t like about your drinking, uh,\u003cbr\u003ewhere do you wanna go from here? Uh, what would you like to\u003cbr\u003echange about your drinking?\u003cbr\u003e\u003ci\u003earousal: 0.283 | f0_mean: 23.4 | loudness_mean: 0.506 | words_per_min: 222 | silence_ratio: 0.037 | jitter: 0.0256 | shimmer: 0.953 | hnr: 3.89 | alpha_ratio: -16.3\u003c\u002fi\u003e","\u003cb\u003e#27\u003c\u002fb\u003e [214.5s] therapist\u003cbr\u003eWell, how about hypothetically if I were to ask you, how\u003cbr\u003ewould your drinking have to impact your life in order for\u003cbr\u003eyou to be ready to change your drinking?\u003cbr\u003e\u003ci\u003earousal: 0.223 | f0_mean: 23.4 | loudness_mean: 0.452 | words_per_min: 200 | silence_ratio: 0.0367 | jitter: 0.0278 | shimmer: 1.11 | hnr: 3.73 | alpha_ratio: -14.6\u003c\u002fi\u003e","\u003cb\u003e#29\u003c\u002fb\u003e [227.5s] therapist\u003cbr\u003eSo if you experienced a negative consequence from your\u003cbr\u003edrinking, uh, that would feel meaningful to you?\u003cbr\u003e\u003ci\u003earousal: -0.118 | f0_mean: 22 | loudness_mean: 0.479 | words_per_min: 204 | silence_ratio: 0 | jitter: 0.0179 | shimmer: 0.944 | hnr: 3.6 | alpha_ratio: -14.7\u003c\u002fi\u003e","\u003cb\u003e#30\u003c\u002fb\u003e [247.0s] therapist\u003cbr\u003eOkay. Well, I like to give this handout to patients. Uh, it\u003cbr\u003edefines risky drinking, it talks about what the consequences\u003cbr\u003eare, uh, and it also lists signs of what an alcohol use\u003cbr\u003edisorder is. So thanks again for taking the time to fill\u003cbr\u003ethis out and being honest with me, uh, to talk about it. I\u003cbr\u003eprovide better care, uh, when I know about my patient&#x27;s\u003cbr\u003esubstance use. When we come back for a three-month follow-up\u003cbr\u003eappointment for your ADHD, I&#x27;d also like to talk to you\u003cbr\u003eand check in about your alcohol use too, if that&#x27;s okay\u003cbr\u003ewith you.\u003cbr\u003e\u003ci\u003earousal: 0.173 | f0_mean: 24.4 | loudness_mean: 0.509 | words_per_min: 189 | silence_ratio: 0.0897 | jitter: 0.018 | shimmer: 1.09 | hnr: 4.15 | alpha_ratio: -12.8\u003c\u002fi\u003e","\u003cb\u003e#31\u003c\u002fb\u003e [267.6s] therapist\u003cbr\u003eOkay, great. See you next time.\u003cbr\u003e\u003ci\u003earousal: -1.07 | f0_mean: 26 | loudness_mean: 0.0951 | words_per_min: 50.5 | silence_ratio: 0.671 | jitter: 0.0168 | shimmer: 1.15 | hnr: 4.38 | alpha_ratio: -13.4\u003c\u002fi\u003e"],"legendgroup":"therapist","marker":{"color":{"dtype":"f8","bdata":"\u002fb0geGNZxj841pNW4X+4P9rllMiALq0\u002fmVSmO4zEUL\u002fCh+KQuwrQPwt4bnYCw9S\u002fjTUkObvj5T8ZxVBaIMbXvy+Hh18Oyd2\u002fa4xX7T9FkL9aKxJfA7qmv+biWziFO4o\u002fWWsbmebp3D\u002fmXUxhMiDSP+zhwMT1hcw\u002fDgXSRG5Cvr\u002fj1G4lcDTGP+WAd7qsC\u002fG\u002f"},"coloraxis":"coloraxis","line":{"color":"#333","width":0.8},"size":13,"symbol":"circle"},"mode":"markers+text","name":"therapist (k\u00f3\u0142ko)","showlegend":false,"text":["0","1","3","5","7","9","11","13","16","18","20","22","24","25","27","29","30","31"],"textfont":{"color":"#555","size":9},"textposition":"top center","x":{"dtype":"f4","bdata":"JdsIwpvsP0ERj8RBcMOawTr 3e","\u003cb\u003e#12\u003c\u002fb\u003e [88.5s] client\u003cbr\u003eI have five or six beers when I go out with friends to a\u003cbr\u003ebar. It&#x27;s not a problem for me.\u003cbr\u003e\u003ci\u003earousal: 0.223 | f0_mean: 24.2 | loudness_mean: 0.346 | words_per_min: 252 | silence_ratio: 0.232 | jitter: 0.0263 | shimmer: 1.43 | hnr: 2.86 | alpha_ratio: -15.3\u003c\u002fi\u003e","\u003cb\u003e#14\u003c\u002fb\u003e [99.0s] client\u003cbr\u003eWell, I don&#x27;t consider my drinking binge drinking.\u003cbr\u003e\u003ci\u003earousal: -0.475 | f0_mean: 24.2 | loudness_mean: 0.322 | words_per_min: 120 | silence_ratio: 0.295 | jitter: 0.0164 | shimmer: 1.28 | hnr: 3.86 | alpha_ratio: -19.4\u003c\u002fi\u003e","\u003cb\u003e#15\u003c\u002fb\u003e [105.0s] client\u003cbr\u003eI don&#x27;t chug a lot of beers in a row. I have about five\u003cbr\u003eor six beers throughout the entire evening.\u003cbr\u003e\u003ci\u003earousal: 0.228 | f0_mean: 22 | loudness_mean: 0.372 | words_per_min: 210 | silence_ratio: 0.15 | jitter: 0.0395 | shimmer: 1.35 | hnr: 2.28 | alpha_ratio: -15.5\u003c\u002fi\u003e","\u003cb\u003e#17\u003c\u002fb\u003e [118.0s] client\u003cbr\u003eBut I&#x27;m healthy. What health problems are you talking\u003cbr\u003eabout?\u003cbr\u003e\u003ci\u003earousal: 0.31 | f0_mean: 25.3 | loudness_mean: 0.315 | words_per_min: 150 | silence_ratio: 0.24 | jitter: 0.0403 | shimmer: 2.01 | hnr: 2.51 | alpha_ratio: -16.8\u003c\u002fi\u003e","\u003cb\u003e#19\u003c\u002fb\u003e [152.0s] client\u003cbr\u003eWell, I didn&#x27;t know about those things.\u003cbr\u003e\u003ci\u003earousal: -0.468 | f0_mean: 23.1 | loudness_mean: 0.279 | words_per_min: 105 | silence_ratio: 0.422 | jitter: 0.0478 | shimmer: 1.31 | hnr: 2.52 | alpha_ratio: -18.7\u003c\u002fi\u003e","\u003cb\u003e#21\u003c\u002fb\u003e [164.0s] client\u003cbr\u003eWell, I-I like beer. I like the way it tastes, I like the\u003cbr\u003eway it makes me feel. Uh, like when I&#x27;m around friends\u003cbr\u003eand it&#x27;s not a problem for me.\u003cbr\u003e\u003ci\u003earousal: 0.0121 | f0_mean: 22.1 | loudness_mean: 0.388 | words_per_min: 155 | silence_ratio: 0.432 | jitter: 0.0292 | shimmer: 1.47 | hnr: 2.2 | alpha_ratio: -15.1\u003c\u002fi\u003e","\u003cb\u003e#23\u003c\u002fb\u003e [179.5s] client\u003cbr\u003eWell, that was fine until I came here, uh, but now that I\u003cbr\u003eknow about the health risk, uh, I have something I gotta\u003cbr\u003ethink about.\u003cbr\u003e\u003ci\u003earousal: -0.0419 | f0_mean: 21.4 | loudness_mean: 0.391 | words_per_min: 173 | silence_ratio: 0.24 | jitter: 0.0243 | shimmer: 1.32 | hnr: 2.28 | alpha_ratio: -15.6\u003c\u002fi\u003e","\u003cb\u003e#26\u003c\u002fb\u003e [208.0s] client\u003cbr\u003eHmm, I&#x27;m not sure. Uh, something I have to think about.\u003cbr\u003e\u003ci\u003earousal: 0.416 | f0_mean: 23 | loudness_mean: 0.374 | words_per_min: 165 | silence_ratio: 0 | jitter: 0.0312 | shimmer: 1.53 | hnr: 2.82 | alpha_ratio: -15.4\u003c\u002fi\u003e","\u003cb\u003e#28\u003c\u002fb\u003e [222.0s] client\u003cbr\u003eUh, I don&#x27;t know. Maybe if I got sick or something, uh,\u003cbr\u003emaybe I&#x27;d wanna change things then.\u003cbr\u003e\u003ci\u003earousal: -0.155 | f0_mean: 22.3 | loudness_mean: 0.391 | words_per_min: 180 | silence_ratio: 0.313 | jitter: 0.0207 | shimmer: 1.26 | hnr: 2.98 | alpha_ratio: -16.5\u003c\u002fi\u003e"],"legendgroup":"client","marker":{"color":{"dtype":"f8","bdata":"HlgzeaWWuz\u002fKlDyIQjDAPymiRB0cUtC\u002fAtkBHbpSxb9pps2eSsbBPyyfVU+iicw\u002f+Sbh4Jlj3r8gwjKV4C7NP5jGQoOT0NM\u002fHmGpK9P63b9dYYDpx82IP9GnFQ14eKW\u002fWVJvhHSc2j8fRrenZc\u002fDvw=="},"coloraxis":"coloraxis","line":{"color":"#333","width":0.8},"size":13,"symbol":"diamond"},"mode":"markers+text","name":"client (romb)","showlegend":false,"text":["2","4","6","8","10","12","14","15","17","19","21","23","26","28"],"textfont":{"color":"#555","size":9},"textposition":"top center","x":{"dtype":"f4","bdata":"grFXQvC7\u002fsGb2QnA1JQWQipvXj8u02  use?\u003cbr\u003e\u003ci\u003earousal: -0.00102 | f0_mean: 23.6 | loudness_mean: 0.405 | words_per_min: 222 | silence_ratio: 0.02 | jitter: 0.0195 | shimmer: 1.04 | hnr: 3.87 | alpha_ratio: -13.5\u003c\u002fi\u003e","\u003cb\u003e#7\u003c\u002fb\u003e [51.5s] therapist\u003cbr\u003eHow would you define drinking too much?\u003cbr\u003e\u003ci\u003earousal: 0.251 | f0_mean: 29.6 | loudness_mean: 0.156 | words_per_min: 140 | silence_ratio: 0.49 | jitter: 0.018 | shimmer: 1.49 | hnr: 2.64 | alpha_ratio: -8.39\u003c\u002fi\u003e","\u003cb\u003e#9\u003c\u002fb\u003e [70.5s] therapist\u003cbr\u003eMm-hmm. Well, in this country, the guidelines are men can\u003cbr\u003edrink up to 14 drinks a week or up to four on one occasion\u003cbr\u003eand still be low risk.\u003cbr\u003e\u003ci\u003earousal: -0.324 | f0_mean: 22.7 | loudness_mean: 0.405 | words_per_min: 158 | silence_ratio: 0.125 | jitter: 0.0166 | shimmer: 1.09 | hnr: 4.25 | alpha_ratio: -16.1\u003c\u002fi\u003e","\u003cb\u003e#11\u003c\u002fb\u003e [84.5s] therapist\u003cbr\u003eSo a limit of four a night doesn&#x27;t feel right to you?\u003cbr\u003e\u003ci\u003earousal: 0.684 | f0_mean: 24.7 | loudness_mean: 0.395 | words_per_min: 240 | silence_ratio: 0.19 | jitter: 0.0409 | shimmer: 1.43 | hnr: 3.32 | alpha_ratio: -15.8\u003c\u002fi\u003e","\u003cb\u003e#13\u003c\u002fb\u003e [94.0s] therapist\u003cbr\u003eYou&#x27;re not alone in feeling that way. Uh, binge\u003cbr\u003edrinking can feel normal to some people.\u003cbr\u003e\u003ci\u003earousal: -0.371 | f0_mean: 22.4 | loudness_mean: 0.37 | words_per_min: 160 | silence_ratio: 0.238 | jitter: 0.0178 | shimmer: 0.988 | hnr: 4.17 | alpha_ratio: -16\u003c\u002fi\u003e","\u003cb\u003e#16\u003c\u002fb\u003e [112.0s] therapist\u003cbr\u003eMm-hmm. Well, technically, we define binge drinking as\u003cbr\u003ehaving more than four drinks on one occasion.\u003cbr\u003e\u003ci\u003earousal: -0.465 | f0_mean: 23 | loudness_mean: 0.248 | words_per_min: 120 | silence_ratio: 0.25 | jitter: 0.0178 | shimmer: 1.16 | hnr: 3.83 | alpha_ratio: -16.4\u003c\u002fi\u003e","\u003cb\u003e#18\u003c\u002fb\u003e [135.0s] therapist\u003cbr\u003eWell, uh, we know if someone binge drinks over time,\u003cbr\u003ethere&#x27;s kind of two categories of risk. There&#x27;s\u003cbr\u003ethe short-term risk where someone who binge drinks is more\u003cbr\u003elikely to fall down, hurt themselves through an accident,\u003cbr\u003euh, they&#x27;re more likely to drive while under the\u003cbr\u003einfluence. Uh, but over the long term, binge drinking can\u003cbr\u003ealso, uh, cause things like heart disease, uh, different\u003cbr\u003ekinds of cancer, liver problems obviously, and then even\u003cbr\u003emental health issues like depression and anxiety are more\u003cbr\u003elikely to happen.\u003cbr\u003e\u003ci\u003earousal: -0.0159 | f0_mean: 23.3 | loudness_mean: 0.441 | words_per_min: 172 | silence_ratio: 0.024 | jitter: 0.0191 | shimmer: 1.05 | hnr: 3.98 | alpha_ratio: -13.8\u003c\u002fi\u003e","\u003cb\u003e#20\u003c\u002fb\u003e [156.0s] therapist\u003cbr\u003eCan I ask you, uh, what do you like about drinking alcohol?\u003cbr\u003e\u003ci\u003earousal: -0.0444 | f0_mean: 25.8 | loudness_mean: 0.439 | words_per_min: 180 | silence_ratio: 0.085 | jitter: 0.0184 | shimmer: 1.09 | hnr: 5.46 | alpha_ratio: -13.3\u003c\u002fi\u003e","\u003cb\u003e#22\u003c\u002fb\u003e [172.5s] therapist\u003cbr\u003eAnd so what about your drinking do you not like or is there\u003cbr\u003eanything that worries you about your drinking?\u003cbr\u003e\u003ci\u003earousal: 0.0128 | f0_mean: 22.1 | loudness_mean: 0.446 | words_per_min: 240 | silence_ratio: 0 | jitter: 0.0163 | shimmer: 0.994 | hnr: 3.82 | alpha_ratio: -17.7\u003c\u002fi\u003e","\u003cb\u003e#24\u003c\u002fb\u003e [189.5s] therapist\u003cbr\u003eSo, on one hand, you like how beer tastes, uh, it&#x27;s\u003cbr\u003epart of your social life to some extent, um, but on the\u003cbr\u003eother hand, you don&#x27;t like the idea of it posing risks\u003cbr\u003eto your health over the long term?\u003cbr\u003e\u003ci\u003earousal: 0.452 | f0_mean: 24 | loudness_mean: 0.601 | words_per_min: 224 | silence_ratio: 0 | jitter: 0.0202 | shimmer: 1.03 | hnr: 3.9 | alpha_ratio: -12.7\u003c\u002fi\u003e","\u003cb\u003e#25\u003c\u002fb\u003e [201.0s] therapist\u003cbr\u003eSo weighing those things, you know, what you like about your\u003cbr\u003edrinking, what you don&#x27;t like about your drinking, uh,\u003cbr\u003ewhere do you wanna go from here? Uh, what would you like to\u003cbr\u003echange about your drinking?\u003cbr\u003e\u003ci\u003earousal: 0.283 | f0_mean: 23.4 | loudness_mean: 0.506 | words_per_min: 222 | silence_ratio: 0.037 | jitter: 0.0256 | shimmer: 0.953 | hnr: 3.89 | alpha_ratio: -16.3\u003c\u002fi\u003e","\u003cb\u003e#27\u003c\u002fb\u003e [214.5s] therapist\u003cbr\u003eWell, how about hypothetically if I were to ask you, how\u003cbr\u003ewould your drinking have to impact your life in order for\u003cbr\u003eyou to be ready to change your drinking?\u003cbr\u003e\u003ci\u003earousal: 0.223 | f0_mean: 23.4 | loudness_mean: 0.452 | words_per_min: 200 | silence_ratio: 0.0367 | jitter: 0.0278 | shimmer: 1.11 | hnr: 3.73 | alpha_ratio: -14.6\u003c\u002fi\u003e","\u003cb\u003e#29\u003c\u002fb\u003e [227.5s] therapist\u003cbr\u003eSo if you experienced a negative consequence from your\u003cbr\u003edrinking, uh, that would feel meaningful to you?\u003cbr\u003e\u003ci\u003earousal: -0.118 | f0_mean: 22 | loudness_mean: 0.479 | words_per_min: 204 | silence_ratio: 0 | jitter: 0.0179 | shimmer: 0.944 | hnr: 3.6 | alpha_ratio: -14.7\u003c\u002fi\u003e","\u003cb\u003e#30\u003c\u002fb\u003e [247.0s] therapist\u003cbr\u003eOkay. Well, I like to give this handout to patients. Uh, it\u003cbr\u003edefines risky drinking, it talks about what the consequences\u003cbr\u003eare, uh, and it also lists signs of what an alcohol use\u003cbr\u003edisorder is. So thanks again for taking the time to fill\u003cbr\u003ethis out and being honest with me, uh, to talk about it. I\u003cbr\u003eprovide better care, uh, when I know about my patient&#x27;s\u003cbr\u003esubstance use. When we come back for a three-month follow-up\u003cbr\u003eappointment for your ADHD, I&#x27;d also like to talk to you\u003cbr\u003eand check in about your alcohol use too, if that&#x27;s okay\u003cbr\u003ewith you.\u003cbr\u003e\u003ci\u003earousal: 0.173 | f0_mean: 24.4 | loudness_mean: 0.509 | words_per_min: 189 | silence_ratio: 0.0897 | jitter: 0.018 | shimmer: 1.09 | hnr: 4.15 | alpha_ratio: -12.8\u003c\u002fi\u003e","\u003cb\u003e#31\u003c\u002fb\u003e [267.6s] therapist\u003cbr\u003eOkay, great. See you next time.\u003cbr\u003e\u003ci\u003earousal: -1.07 | f0_mean: 26 | loudness_mean: 0.0951 | words_per_min: 50.5 | silence_ratio: 0.671 | jitter: 0.0168 | shimmer: 1.15 | hnr: 4.38 | alpha_ratio: -13.4\u003c\u002fi\u003e"],"legendgroup":"therapist","marker":{"color":{"dtype":"f8","bdata":"\u002fb0geGNZxj841pNW4X+4P9rllMiALq0\u002fmVSmO4zEUL\u002fCh+KQuwrQPwt4bnYCw9S\u002fjTUkObvj5T8ZxVBaIMbXvy+Hh18Oyd2\u002fa4xX7T9FkL9aKxJfA7qmv+biWziFO4o\u002fWWsbmebp3D\u002fmXUxhMiDSP+zhwMT1hcw\u002fDgXSRG5Cvr\u002fj1G4lcDTGP+WAd7qsC\u002fG\u002f"},"coloraxis":"coloraxis","line":{"color":"#333","width":0.8},"size":13,"symbol":"circle"},"mode":"markers+text","name":"therapist (k\u00f3\u0142ko)","showlegend":true,"text":["0","1","3","5","7","9","11","13","16","18","20","22","24","25","27","29","30","31"],"textfont":{"color":"#555","size":9},"textposition":"top center","x":{"dtype":"f4","bdata":"jUVPQFc7AUHXDQFBbGjQP4pUTUD0q9xAbTPxQDpW8j+W75dAZaTIvkkd9D+DcQ5AXLjzPcqCUkCLupFAF92jQCFdoz8\u002f08bA"},"y":{"dtype":"f4","bdata":"ScHewGYOd0Dn0PQ\u002fMAjiwDQrL79nySBA7FDRQHd4A0C+fVY\u002fVeM2QKFoi8DrSETA2n+IQL5Fd8AHQoPACTw0wFIIAcEWCn8\u002f"},"type":"scatter","xaxis":"x3","yaxis":"y3"},{"hoverinfo":"text","hovertext":["\u003cb\u003e#2\u003c\u002fb\u003e [15.0s] client\u003cbr\u003eYeah, but only on the weekend.\u003cb
